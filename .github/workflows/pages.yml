# Runs the quality gates (`pnpm check`) and the static end-to-end suite (`pnpm test:e2e:static`),
# then builds the static solo web app (ADR-0017, `vite build --mode static`) and deploys it to
# GitHub Pages from GitHub Actions. The whole workspace is installed because `pnpm check` and the
# `tsc -b` step of the e2e script type-check every package (server and database included). No
# Postgres or game server is started: the static e2e serves its own build on port 4174.
#
# Action versions verified 2026-10-22 against each action's GitHub releases/tags.
# pnpm/action-setup is pinned to the v6.1.0 commit: the floating `v6` tag lags behind v6.1.0,
# which is the release that adds pnpm v12 support.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (which runs dependency install scripts and tests) gets only
# `contents: read`; the Pages/OIDC permissions are granted to the deploy job alone.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Install + check + one full L1 solo match (~2 min, per-test timeout 6 min) + build.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reads the pnpm version from the `packageManager` field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type-check, lint, format check and unit tests.
      - name: Quality gates
        run: pnpm check

      # Browser for the installed @playwright/test version (flags checked against
      # `playwright install --help` of 1.64.1).
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Builds its own static copy into a temp folder and serves it under /the-tally/.
      - name: Static end-to-end tests
        run: pnpm test:e2e:static

      - name: Build static web app
        run: pnpm --filter @cartignon/web build:static

      # No configure-pages step: the static build uses `base './'`, so it needs no Pages metadata.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
