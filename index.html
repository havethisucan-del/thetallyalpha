<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>The Tally</title>
    <script>
      // Applies the stored light/dark choice before the first paint (no theme flash); same key
      // and values as src/theme/theme.ts. Without a valid choice the page follows the OS.
      try {
        var t = localStorage.getItem('cartignon.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
